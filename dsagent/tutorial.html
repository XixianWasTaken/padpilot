<title>DualSense Pad School</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: one centred column, like a 2003 fan homepage built around a game tutorial. Top to bottom:
   glitter header + marquee, the agent's screen as a Win98 window, the coach's speech box, then the
   controller in a rainbow glitter frame with only the key to press lit up; 88x31 badges at the end.
   One committed dark look (night-sky GeoCities), so no light theme. */
:root {
  --void: #14002e;      /* page sky */
  --panel: #2b0b52;     /* boxes */
  --panel-hi: #4a1a85;  /* bevel light edge */
  --panel-lo: #090016;  /* bevel dark edge */
  --fg: #fff3ff;
  --muted: #cfaef0;
  --hot: #ff3fd8;       /* hot pink, the one loud accent */
  --cyan: #3ff4ff;
  --gold: #ffe34d;      /* "press this" */
  --good: #a8ff3f;
  --bad: #ff4d6d;
  --win-a: #000080;     /* Win98 title bar */
  --win-b: #1084d0;
  --term: #05000d;
  --shell: #f1eef8;
  --shell-edge: #b8b0d4;
  --key: #2a1d4f;
  --key-fg: #fff3ff;
  --tri: #0fae7c; --cir: #f0325a; --crs: #2f62ff; --sqr: #d42fc9;
  --lc: rgb(90, 90, 110);
  --pixel: "Press Start 2P", "ZCOOL KuaiLe", monospace;
  --cute: "ZCOOL KuaiLe", "Noto Sans SC", system-ui, sans-serif;
  --vt: "VT323", "TermCJK", ui-monospace, Menlo, monospace;
  --body: "Noto Sans SC", system-ui, sans-serif;
  --head: var(--cute);
  --say: var(--cute);
  color-scheme: dark;
}
html[lang="en"] { --head: var(--pixel); --say: var(--vt); }
/* Chinese inside the VT323 terminal: a system CJK face shrunk to sit on VT323's small x-height. */
@font-face { font-family: "TermCJK"; src: local("PingFang SC"), local("Hiragino Sans GB"), local("Microsoft YaHei"), local("Noto Sans CJK SC"), local("Noto Sans SC"); size-adjust: 84%; unicode-range: U+2E80-9FFF, U+3000-303F, U+FF00-FFEF; }
@property --ang { syntax: "<angle>"; inherits: false; initial-value: 0deg; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background-color: var(--void); color: var(--fg); }
body {
  font-family: var(--body); font-size: 15px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px 32px;
  /* tiled pixel night sky: two star layers that twinkle out of step */
  background-image:
    radial-gradient(1.5px 1.5px at 12px 18px, #fff 99%, transparent),
    radial-gradient(1px 1px at 58px 72px, var(--cyan) 99%, transparent),
    radial-gradient(1.5px 1.5px at 96px 40px, var(--hot) 99%, transparent),
    radial-gradient(1px 1px at 33px 101px, #fff 99%, transparent),
    radial-gradient(1px 1px at 110px 112px, var(--gold) 99%, transparent),
    linear-gradient(180deg, #1d0042 0%, var(--void) 40%, #0a0019 100%);
  background-size: 128px 128px, 128px 128px, 128px 128px, 128px 128px, 128px 128px, 100% 100%;
  background-attachment: fixed;
  min-height: 100%;
}
body::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background-image: radial-gradient(1.5px 1.5px at 80px 24px, #fff 99%, transparent), radial-gradient(1px 1px at 20px 70px, var(--hot) 99%, transparent), radial-gradient(1.5px 1.5px at 70px 100px, var(--cyan) 99%, transparent);
  background-size: 128px 128px; animation: twinkle 2.4s steps(2) infinite; }
@keyframes twinkle { 50% { opacity: .15; } }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px dashed var(--gold); outline-offset: 3px; }
.wrap { position: relative; z-index: 1; max-width: 720px; margin: 0 auto; display: grid; gap: 14px; }
.pixbox, .bubble { box-shadow: 0 -3px 0 0 var(--bc, var(--hot)), 0 3px 0 0 var(--bc, var(--hot)), -3px 0 0 0 var(--bc, var(--hot)), 3px 0 0 0 var(--bc, var(--hot)); }

/* ---------- header: glitter brand, pixel progress, language */
header { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.brand { position: relative; font-family: var(--head); font-size: 26px; line-height: 1.1; white-space: nowrap; letter-spacing: .02em;
  background: radial-gradient(circle at 20% 30%, #fff 0 1.2px, transparent 2px) 0 0 / 9px 9px,
              radial-gradient(circle at 70% 60%, #fff 0 1px, transparent 1.8px) 0 0 / 13px 11px,
              linear-gradient(90deg, var(--hot), var(--gold), var(--cyan), var(--hot)) 0 0 / 300% 100%;
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(2px 2px 0 var(--panel-lo)) drop-shadow(0 0 6px color-mix(in srgb, var(--hot) 70%, transparent));
  animation: glitter 1.2s steps(4) infinite, rainbow 6s linear infinite; }
html[lang="en"] .brand { font-size: 15px; }
@keyframes glitter { 50% { background-position: 4px 3px, 7px 5px, 0 0; } }
@keyframes rainbow { to { background-position: 0 0, 0 0, 300% 0; } }
.brand-wrap { position: relative; padding: 4px 10px 4px 2px; }
.spark { position: absolute; width: 12px; height: 12px; background: var(--gold); pointer-events: none;
  clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%); animation: tw 1.4s ease-in-out infinite; }
.spark.s2 { background: var(--cyan); width: 8px; height: 8px; animation-delay: .5s; }
.spark.s3 { background: #fff; width: 10px; height: 10px; animation-delay: .9s; }
@keyframes tw { 0%, 100% { transform: scale(.2) rotate(0); opacity: .3; } 50% { transform: scale(1) rotate(45deg); opacity: 1; } }
.progress { flex: 1 1 200px; display: flex; gap: 3px; min-width: 0; padding: 3px; background: var(--panel-lo); border: 2px solid var(--panel-hi); }
.progress i { flex: 1; height: 10px; background: #2a1450; }
.progress i.done { background: repeating-linear-gradient(90deg, var(--good) 0 4px, #6fd122 4px 6px); }
.progress i.now { background: var(--gold); animation: blinkk 0.8s steps(1) infinite; }
@keyframes blinkk { 50% { background: transparent; } }
.lang { display: flex; flex: none; gap: 6px; }
.lang button { font-family: "Press Start 2P", var(--cute), monospace; font-size: 9px; padding: 6px 8px; cursor: pointer; color: var(--muted);
  background: var(--panel); border: 2px solid; border-color: var(--panel-hi) var(--panel-lo) var(--panel-lo) var(--panel-hi); }
.lang button[aria-pressed="true"] { color: var(--void); background: var(--gold); border-color: #fff8b8 #a88a00 #a88a00 #fff8b8; }

.marquee { overflow: hidden; white-space: nowrap; background: var(--hot); color: var(--void); border-block: 2px solid var(--gold);
  font-family: var(--vt); font-size: 19px; line-height: 1.35; padding-block: 1px; }
.marquee span { display: inline-block; padding-left: 100%; animation: mq 22s linear infinite; }
@keyframes mq { to { transform: translateX(-100%); } }

/* ---------- the agent's screen as a Win98 window */
.term { background: #c0c0c0; padding: 3px; border: 2px solid; border-color: #fff #404040 #404040 #fff; box-shadow: 4px 4px 0 var(--panel-lo); }
.term .bar { display: flex; align-items: center; gap: 6px; padding: 3px 4px 3px 7px; color: #fff; font-family: var(--vt); font-size: 18px; line-height: 1;
  background: linear-gradient(90deg, var(--win-a), var(--win-b)); }
.term .bar b { font-weight: 400; }
.term .bar .lvl { margin-left: auto; font-family: var(--body); font-size: 12px; }
.term .bar .wb { display: inline-grid; place-items: center; width: 18px; height: 16px; background: #c0c0c0; color: #000; font-family: var(--vt); font-size: 15px;
  border: 2px solid; border-color: #fff #404040 #404040 #fff; }
.term .bar .lvl + .wb { margin-left: 6px; }
.term .body { margin-top: 3px; background: var(--term); border: 2px solid; border-color: #404040 #fff #fff #404040;
  padding: 8px 12px 10px; height: 204px; overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column;
  font-family: var(--vt); font-size: 19px; line-height: 1.2; color: #d8ffd8; }
.term .log { margin-top: auto; }
.ln { white-space: pre-wrap; word-break: break-word; }
.c-dim { color: #8b7fb0; } .c-ok { color: var(--good); } .c-warn { color: #ffb347; } .c-err { color: var(--bad); }
.c-you { color: var(--cyan); } .c-acc { color: #ff9cf0; }
.box { border: 2px dashed #ffb347; padding: 4px 9px; margin: 6px 0; }
.box.card { border-color: var(--hot); }
.input { border: 2px solid #4b3d73; padding: 3px 9px; margin-top: 8px; color: var(--cyan); }
.cur { display: inline-block; width: 9px; height: 15px; background: var(--cyan); vertical-align: -2px; animation: cur 1s steps(1) infinite; }
@keyframes cur { 50% { opacity: 0; } }
.new { animation: pop .3s steps(3); }
@keyframes pop { from { opacity: 0; transform: translateY(6px); } }
.wheel { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 5px; margin-top: 6px; font-family: var(--body); font-size: 11.5px; line-height: 1.35; }
.wheel div { border: 2px dotted #4b3d73; padding: 4px; text-align: center; min-height: 38px; display: grid; place-items: center; }
.wheel .hub { border-style: solid; color: var(--tri); font-family: var(--vt); font-size: 20px; }
.wheel .sel { border: 2px solid var(--gold); background: color-mix(in srgb, var(--gold) 22%, transparent); color: #fff; }

/* ---------- the coach */
.coach { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 14px; align-items: start; }
.avatar { width: 52px; height: 52px; display: grid; place-items: center; background: var(--panel); font-family: "Press Start 2P", monospace; font-size: 12px; color: var(--fg);
  border: 4px solid var(--lc); box-shadow: 0 0 12px var(--lc), 3px 3px 0 var(--panel-lo); image-rendering: pixelated; transition: border-color .3s, box-shadow .3s; }
.bubble { --bc: var(--hot); position: relative; background: var(--panel); padding: 12px 15px; min-height: 76px; margin: 3px; }
.bubble::before { content: ""; position: absolute; left: -12px; top: 18px; width: 9px; height: 12px; background: var(--bc);
  clip-path: polygon(0 50%, 100% 0, 100% 100%); }
.bubble.ok { --bc: var(--good); }
.bubble.no { animation: shake .3s steps(4); }
@keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
.say { font-family: var(--say); font-size: 18px; line-height: 1.55; margin: 0; letter-spacing: .01em; }
html[lang="en"] .say { font-size: 22px; line-height: 1.2; }
.say b { color: var(--gold); font-weight: 400; text-shadow: 0 0 8px color-mix(in srgb, var(--gold) 60%, transparent); }
.sub { margin: 6px 0 0; color: var(--muted); font-size: 13.5px; }
.sub.bad { color: var(--bad); }
.cta { display: inline-flex; align-items: center; gap: 6px; margin-top: 2px; color: var(--muted); font-size: 13px; }
.sym { font-family: var(--vt); font-size: 17px; line-height: 1; padding: 1px 6px; color: var(--key-fg); background: var(--key); white-space: nowrap;
  border: 2px solid; border-color: #6a5aa0 #0c0420 #0c0420 #6a5aa0; }
.timer { height: 10px; background: var(--panel-lo); border: 2px solid var(--panel-hi); margin-top: 8px; }
.timer i { display: block; height: 100%; width: 100%; background: repeating-linear-gradient(90deg, var(--gold) 0 6px, #c9a800 6px 8px); }
.note { font-size: 12.5px; color: var(--muted); border-left: 4px solid var(--hot); padding-left: 10px; margin-top: 6px; }
.note code { font-family: var(--vt); font-size: 16px; background: var(--key); padding: 0 5px; color: var(--cyan); }

/* ---------- the controller in a rainbow glitter frame */
.padbox { position: relative; padding: 8px 6px 2px; overflow: hidden;
  border: 5px solid transparent;
  background: radial-gradient(ellipse at 50% 35%, #2c1060 0%, #170638 70%) padding-box,
              conic-gradient(from var(--ang), var(--hot), var(--gold), var(--good), var(--cyan), #8a5cff, var(--hot)) border-box;
  animation: spin 4s linear infinite; }
@keyframes spin { to { --ang: 360deg; } }
.padbox .spark { z-index: 1; }
.glow { position: absolute; left: 50%; top: 14%; width: 56%; height: 38%; transform: translateX(-50%); background: var(--lc); filter: blur(60px); opacity: .45; border-radius: 50%; pointer-events: none; }
svg.ctl { width: 100%; height: auto; display: block; position: relative; touch-action: none; user-select: none; -webkit-user-select: none; }
.shell { fill: url(#g-shell); stroke: #0b0620; stroke-width: 4; stroke-linejoin: round; }
.hit { cursor: pointer; transition: opacity .25s; }
.hit .k { fill: url(#g-key); stroke: #0b0620; stroke-width: 2; transition: fill .08s; }
.hit .k.stk, .hit .k.dk { fill: url(#g-stick); }
.hit.sh .k { fill: url(#g-sh); stroke: #0b0620; stroke-width: 3; stroke-linejoin: round; }
.lbl.on-sh { fill: #3a2a70; font-size: 18px; }
.hit .k.pad { fill: url(#g-pad); stroke: #b8b0d4; }
.hit.down .k, .hit.sh.down .k { fill: #b9a5ff; }
.hit.latched .k, .hit.sh.latched .k { fill: #ff9be8; }
.hit.latched .ring { stroke: var(--hot); stroke-width: 3; }
.ring { fill: none; stroke: transparent; }
svg.spotlight .hit:not(.target):not(.latched) { opacity: .62; filter: saturate(.45); }
svg.spotlight .hit[data-btn="touchpad"]:not(.target) { opacity: .9; }
.hit.target .ring { stroke: var(--gold); stroke-width: 4; stroke-dasharray: 6 4; animation: pulse .9s steps(3) infinite; }
.hit.target .k { filter: drop-shadow(0 0 7px var(--gold)); }
@keyframes pulse { 50% { stroke-width: 7; stroke: var(--hot); } }
.hit.hit-ok .k, .hit.sh.hit-ok .k { fill: var(--good); }
.lbl { font-family: "VT323", monospace; font-size: 15px; fill: #ffffff; pointer-events: none; }
.lbl.on-key { fill: #3a2a70; }
.stick .lbl.on-key, [data-btn="ps"] .lbl.on-key { fill: #fff3ff; }
.lbl.on-pad { fill: #9a90bd; font-size: 17px; }
.lb { fill: var(--lc); }
.sticker { animation: tw2 1.6s steps(3) infinite; transform-box: fill-box; transform-origin: center; }
.sticker.s2 { animation-delay: .5s; } .sticker.s3 { animation-duration: 2.2s; }
@keyframes tw2 { 50% { opacity: .55; transform: scale(.8); } }
.ptr .bob { animation: bob .7s steps(2) infinite; }
.ptr.up .bob { animation-name: bobup; }
.ptr.side .bob { animation-name: none; }
@keyframes bob { 50% { transform: translateY(-5px); } }
@keyframes bobup { 50% { transform: translateY(5px); } }
.ptr .arrow { fill: var(--gold); stroke: #0b0620; stroke-width: 2; stroke-linejoin: miter; }
.st-breathe .lb, .st-breathe .glow { animation: breathe var(--per, 3s) ease-in-out infinite; }
.st-blink .lb, .st-blink .glow { animation: blink var(--per, 1s) steps(1) infinite; }
@keyframes breathe { 0%, 100% { opacity: var(--min, .2); } 50% { opacity: 1; } }
@keyframes blink { 0% { opacity: 1; } 50% { opacity: .07; } }
.padbox.rumble svg.ctl { animation: rumble .09s steps(2) 5; }
@keyframes rumble { 25% { transform: translate(-3px, 1px); } 75% { transform: translate(3px, -1px); } }
.badge { position: absolute; left: 50%; transform: translateX(-50%); top: 8px; white-space: nowrap; z-index: 1;
  background: var(--void); border: 2px solid var(--lc); padding: 0 9px; color: var(--muted); font-family: var(--vt); font-size: 17px; line-height: 1.3; }
.badge b { color: var(--fg); font-weight: 400; }

/* ---------- footer: status, hit counter, 88x31 buttons */
.foot { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 14px; font-size: 12.5px; color: var(--muted); }
.foot button { background: none; border: 0; padding: 0; color: var(--cyan); text-decoration: underline; cursor: pointer; font-size: 12.5px; }
.foot button:hover { color: var(--gold); }
.dot { display: inline-block; width: 9px; height: 9px; background: var(--muted); margin-right: 6px; vertical-align: 0; }
.dot.on { background: var(--good); box-shadow: 0 0 8px var(--good); animation: blinkk 1.2s steps(1) infinite; }
.keys { --bc: var(--cyan); font-size: 12.5px; color: var(--muted); background: var(--panel); padding: 10px 14px; margin: 3px; }
.keys ul { margin: 0; padding-left: 18px; }
.web1 { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px 10px; padding-top: 4px; }
.counter { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); }
.counter span { display: inline-flex; gap: 2px; }
.counter i { font-style: normal; font-family: var(--vt); font-size: 20px; line-height: 1; width: 14px; text-align: center; padding: 2px 0; background: #000; color: #ff3030; border: 1px solid #555; text-shadow: 0 0 4px #ff3030; }
.b88 { width: 88px; height: 31px; display: grid; place-items: center; text-align: center; font-family: "Press Start 2P", monospace; font-size: 6.5px; line-height: 1.5; padding: 2px;
  border: 2px solid; border-color: #fff #444 #444 #fff; image-rendering: pixelated; }
.b88.a { background: linear-gradient(180deg, #000 0 50%, #1d1d1d 50%); color: var(--gold); }
.b88.b { background: repeating-linear-gradient(45deg, var(--hot) 0 4px, #c4169f 4px 8px); color: #fff; text-shadow: 1px 1px 0 #000; }
.b88.c { background: linear-gradient(180deg, #0a3d0a, #000); color: var(--good); }

/* ---------- level cards */
.overlay { position: absolute; inset: 0; background: color-mix(in srgb, var(--void) 88%, transparent); display: grid; place-items: center; padding: 16px; z-index: 2; }
.card-l { max-width: 440px; width: 100%; text-align: center; display: grid; gap: 12px; animation: pop .4s steps(4); }
.card-l .eyebrow { font-family: "Press Start 2P", var(--cute), monospace; font-size: 10px; letter-spacing: .08em; color: var(--good); animation: blinkk 1s steps(1) infinite; }
.card-l .eyebrow::before, .card-l .eyebrow::after { content: " ★ "; color: var(--gold); }
.card-l h2 { font-family: var(--head); font-weight: 400; font-size: 28px; line-height: 1.25; margin: 0; text-wrap: balance;
  color: #fff; text-shadow: 2px 2px 0 var(--hot), 4px 4px 0 var(--panel-lo); }
html[lang="en"] .card-l h2 { font-size: 17px; line-height: 1.5; }
.learned { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.learned span { background: var(--panel); padding: 2px 10px; font-size: 13px; border: 2px solid var(--cyan); }
.swatches { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px 10px; text-align: left; font-size: 13px; }
@media (max-width: 480px) { .swatches { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.swatches div { display: flex; align-items: center; gap: 8px; }
.swatches i { width: 14px; height: 14px; flex: none; border: 2px solid var(--panel-lo); }
.actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
.btn { cursor: pointer; padding: 8px 16px; color: var(--fg); background: var(--key); border: 3px solid; border-color: #6a5aa0 #0c0420 #0c0420 #6a5aa0; }
.btn:active { border-color: #0c0420 #6a5aa0 #6a5aa0 #0c0420; }
.btn.primary { background: var(--gold); color: var(--void); border-color: #fff8b8 #a88a00 #a88a00 #fff8b8; font-weight: 700; }
.btn.primary .sym { background: transparent; color: var(--void); border-color: #a88a00; }
.score { font-family: "Press Start 2P", monospace; font-size: 46px; line-height: 1; font-variant-numeric: tabular-nums; color: var(--gold); text-shadow: 3px 3px 0 var(--hot), 6px 6px 0 var(--panel-lo); }

/* sparkle cursor trail */
.trail { position: fixed; z-index: 50; width: 10px; height: 10px; margin: -5px 0 0 -5px; pointer-events: none;
  clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%); animation: fall .7s ease-in forwards; }
@keyframes fall { to { transform: translateY(26px) scale(.2) rotate(90deg); opacity: 0; } }

@media (prefers-reduced-motion: reduce) {
  .st-breathe .lb, .st-breathe .glow, .st-blink .lb, .st-blink .glow, .hit.target .ring, .cur, .sticker, .ptr .bob, .brand, .spark, .marquee span,
  .padbox, .padbox.rumble svg.ctl, .bubble.no, .new, .card-l, .card-l .eyebrow, .progress i.now, .dot.on, body::after { animation: none; }
  .marquee span { padding-left: 0; }
}
@media (max-width: 520px) {
  .say { font-size: 16.5px; } html[lang="en"] .say { font-size: 20px; }
  .term .body { height: 176px; font-size: 17px; } .badge { display: none; } .brand { font-size: 22px; }
  .coach { grid-template-columns: 40px minmax(0, 1fr); gap: 12px; } .avatar { width: 40px; height: 40px; font-size: 9px; border-width: 3px; }
}
</style>

<div class="wrap">
  <header>
    <div class="brand-wrap"><span class="spark" style="left:-6px;top:-4px"></span><span class="spark s2" style="right:-2px;top:2px"></span><span class="spark s3" style="right:22px;bottom:-6px"></span><div class="brand" id="brand">手柄驾校</div></div>
    <div class="progress" id="progress" aria-hidden="true"></div>
    <div class="lang" role="group" aria-label="language">
      <button id="lang-zh" type="button" aria-pressed="true">中文</button>
      <button id="lang-en" type="button" aria-pressed="false">EN</button>
    </div>
  </header>
  <div class="marquee" aria-hidden="true"><span id="marquee"></span></div>

// ------------------------------------------------------------------ state + rendering
const G = { step: Math.min(store.get("step", 0), STEPS.length), phase: "ask", misses: 0, lines: [], fresh: 0, input: "", light: "idle", rush: null };

function setLight(name) {
  const l = LIGHTS[name] || LIGHTS.idle;
  G.light = name;
  dsPost("/light", { state: LIGHTS[name] ? name : "idle" });
  const box = $("padbox"), rgb = "rgb(" + l.rgb.join(",") + ")";
  box.style.setProperty("--lc", rgb);
  document.documentElement.style.setProperty("--lc", rgb);
  box.style.setProperty("--per", (l.per || 1) + "s");
  box.style.setProperty("--min", l.min ?? .2);
  box.classList.remove("st-breathe", "st-blink");
  if (l.kind !== "solid") box.classList.add("st-" + l.kind);
  $("avatar").style.borderColor = rgb;
  $("light-badge").innerHTML = esc(S.lang === "zh" ? "光条 " : "Light ") + "<b></b>";
  $("light-badge").querySelector("b").textContent = T(l);
}
// Real vibration through the Gamepad API (Chrome-family browsers support "dual-rumble" on a DualSense),
// mirroring dsagent's rumble patterns: [ms, strong, weak]; zeros are gaps.
const RUMBLE = {
  attention: [[200, .8, .5], [90, 0, 0], [200, .8, .5]],
  error: [[450, 1, .2]],
  tick: [[60, 0, .45]],
};
function padRumble(kind) {
  if (DS.on) { dsPost("/rumble", { pattern: kind }); return; }
  const g = livePad();
  const act = g && g.vibrationActuator;
  if (!act || !RUMBLE[kind]) return;
  let t = 0;
  for (const [ms, strong, weak] of RUMBLE[kind]) {
    if (strong || weak) setTimeout(() => { try { act.playEffect("dual-rumble", { duration: ms, strongMagnitude: strong, weakMagnitude: weak }).catch(() => {}); } catch {} }, t);
    t += ms;
  }
}
function rumble(kind) {
  const p = $("padbox"); p.classList.remove("rumble"); void p.offsetWidth; p.classList.add("rumble");
  padRumble(kind || "attention");
}
function lineEl(l, isNew) {
  const d = document.createElement("div");
  d.className = "ln " + (l.cls || "") + (isNew ? " new" : "");
  d.textContent = T(l.t);
  return d;
}
function pushLines(ls) { G.lines.push(...ls); G.lines = G.lines.slice(-30); G.fresh = ls.length; }
function renderLog(temp) {
  const log = $("log"); log.textContent = "";
  G.lines.forEach((l, i) => log.appendChild(lineEl(l, i >= G.lines.length - G.fresh)));
  if (temp && temp.box) {
    const b = document.createElement("div"); b.className = temp.box.cls;
    temp.box.lines.forEach((l) => b.appendChild(lineEl(l)));
    log.appendChild(b);
  }
  if (temp && temp.wheel) log.appendChild(wheelEl());
  const inp = document.createElement("div"); inp.className = "input";
  inp.textContent = "> " + (G.input ? T(G.input) : "");
  const c = document.createElement("span"); c.className = "cur"; inp.appendChild(c);
  log.appendChild(inp);
  const body = $("term-body"); body.scrollTop = body.scrollHeight;
}
let wheelSel = null;
function wheelEl() {
  const w = document.createElement("div"); w.className = "wheel"; w.id = "wheel";
  for (const n of [7, 0, 1, 6, -1, 2, 5, 4, 3]) {
    const d = document.createElement("div");
    if (n < 0) { d.className = "hub"; d.textContent = "△"; }
    else { d.textContent = T(WHEEL[n]); d.dataset.sector = n; if (wheelSel === n) d.className = "sel"; }
    w.appendChild(d);
  }
  return w;
}
function updateWheel() { const w = $("wheel"); w && w.querySelectorAll("[data-sector]").forEach((d) => d.classList.toggle("sel", +d.dataset.sector === wheelSel)); }

function targetEls(action) {
  const q = (s) => document.querySelector(s);
  if (action.startsWith("wheel_pick")) return [q('[data-btn="triangle"]'), q('[data-stick="l"]'), q('[data-stick="r"]')];
  const base = action.replace(/_hold$/, "");
  if (/^rstick_|^r3$/.test(base)) return [q('[data-stick="r"]')];
  if (/^stick_|^l3$/.test(base)) return [q('[data-stick="l"]')];
  return base.split("+").map((p) => q('[data-btn="' + p + '"]'));
}
function spotlight(actions) {
  document.querySelectorAll(".hit.target").forEach((g) => g.classList.remove("target"));
  $("ctl").classList.toggle("spotlight", !!(actions && actions.length));
  const els = [];
  for (const a of actions || []) targetEls(a).forEach((el) => { if (el && !els.includes(el)) { el.classList.add("target"); els.push(el); } });
  placePointers(els);
}
// A bouncing pixel arrow over each key to press.
const SIDE_PTR = { l2_full: [112, 34, "r"], r2_full: [528, 34, "l"], l1: [88, 92, "r"], r1: [552, 92, "l"] };
function placePointers(els) {
  const layer = $("pointers"); if (!layer) return;
  layer.textContent = "";
  els.slice(0, 3).forEach((el) => {
    const side = SIDE_PTR[el.dataset.btn];
    if (side) {                                              // shoulders: point in from the outside
      const [x, y, dir] = side;
      layer.insertAdjacentHTML("beforeend", '<g class="ptr side" transform="translate(' + x + " " + y + ')"><g class="bob">' +
        '<path class="arrow" d="M-7 -20 H7 V-11 H14 L0 0 L-14 -11 H-7 Z" transform="rotate(' + (dir === "r" ? -90 : 90) + ')"/></g></g>');
      return;
    }
    let b; try { b = el.getBBox(); } catch { return; }
    const cx = b.x + b.width / 2, up = b.y < 44;            // keys at the top get the arrow from below
    const y = up ? b.y + b.height + 2 : b.y - 2;
    const arrow = "M-7 -20 H7 V-11 H14 L0 0 L-14 -11 H-7 Z";
    layer.insertAdjacentHTML("beforeend",
      '<g class="ptr' + (up ? " up" : "") + '" transform="translate(' + cx + " " + y + ')"><g class="bob">' +
      '<path class="arrow" d="' + arrow + '"' + (up ? ' transform="scale(1 -1)"' : "") + "/></g></g>");
  });
}
function coach(sayHtml, subHtml, subCls) {

  $("say").innerHTML = sayHtml;
  $("sub").className = "sub" + (subCls ? " " + subCls : "");
  $("sub").innerHTML = subHtml || "";
}
function renderProgress() {
  const p = $("progress"); p.textContent = "";
  STEPS.forEach((_, i) => { const d = document.createElement("i"); if (i < G.step) d.className = "done"; else if (i === G.step) d.className = "now"; p.appendChild(d); });
  const st = STEPS[G.step];
  $("lvl").textContent = st ? (S.lang === "zh" ? "第 " + (st.lv + 1) + " 关 · " : "Level " + (st.lv + 1) + " · ") + T(LEVELS[st.lv]) : "";
}
const cont = () => '<span class="cta"><span class="sym">✕</span> ' + esc(S.lang === "zh" ? "继续" : "Continue") + "</span>";

// ------------------------------------------------------------------ flow
function openStep(fresh) {
  hideOverlay();
  G.phase = "ask"; G.misses = 0; wheelSel = null;
  const st = STEPS[G.step];
  if (!st) return graduate();
  if (fresh !== false) {
    if (st.show) pushLines(st.show); else G.fresh = 0;
    if (st.input) G.input = st.input;
  }
  setLight(st.light);
  if (st.rumble && fresh !== false) rumble(st.light === "error" ? "error" : "attention");
  renderLog(st);
  renderProgress();
  spotlight(st.expect ? st.expect.slice(0, 1) : ["cross"]);
  let sub = "";
  if (st.intro) sub = '<div class="note">' + (S.lang === "zh"
    ? (DS.on ? "真手柄已接上，现在是练习模式：你按的键只在这个网页里生效，不会发给 Claude；关掉这个网页就退出练习。没手柄的话，也可以点图上的键或用键盘（见底下“键盘怎么按”）。"
             : "没手柄也行：直接点图上的键，或用键盘（见底下“键盘怎么按”）。想用真手柄练习，请在 Claude Code 里输入 <code>/dualsense:tutorial</code>（或在终端运行 <code>dsagent tutorial</code>）打开本页：那样打开的页面能读到手柄，按键也不会发给 Claude。")
    : (DS.on ? "Your controller is connected and you are in practice mode: presses only count on this page and never reach Claude. Closing this page ends practice. You can also click the keys on the picture or use the keyboard (see “Keyboard keys” below)."
             : "No controller? Click the keys on the picture or use the keyboard (see “Keyboard keys” below). To practise with the real controller, type <code>/dualsense:tutorial</code> in Claude Code (or run <code>dsagent tutorial</code>) to open this page: opened that way it reads the controller, and your presses won't reach Claude.")) + "</div>";
  if (!st.intro && gpName && !DS.on) {
    const keys = (st.expect || []).flatMap((a) => a.replace(/_hold$/, "").split("+"));
    if (keys.includes("ps") || keys.includes("mic")) sub = padNote(keys.includes("ps"), keys.includes("mic"));
  }
  coach(rich(T(st.say)), sub);
  store.set("step", G.step);
}
function padNote(ps, mic) {
  const zh = [], en = [];
  if (ps) { zh.push("浏览器直接读手柄时，macOS 也看得到 PS 键，按 PS 可能会打开 Apple「游戏」App：这一步请用鼠标点图上的 PS（或按键盘 P）。用 /dualsense:tutorial 打开本页就没有这个问题。");
            en.push("When the browser reads the controller itself, macOS sees the PS button too and may open Apple's Games app: click PS on the picture instead (or press P). Opening this page with /dualsense:tutorial avoids this."); }
  if (mic) { zh.push("浏览器读不到手柄上的麦克风键：请点图上的麦克风键（或按键盘 M）。");
             en.push("Browsers can't read the controller's mic button: click Mic on the picture (or press M)."); }
  return '<div class="note">' + esc((S.lang === "zh" ? zh : en).join(" ")) + "</div>";
}
function succeed(st, action) {
  G.phase = "after";
  padRumble("tick");
  targetEls(action).forEach((el) => { if (!el) return; el.classList.add("hit-ok"); setTimeout(() => el.classList.remove("hit-ok"), 500); });
  spotlight([]);
  if (!st.expect) return advance();
  if (st.after) pushLines(st.after); else G.fresh = 0;
  if (st.clearInput) G.input = "";
  if (st.end) setLight(st.end);
  renderLog(null);

  let last = 0, n = 0;
  window.addEventListener("pointermove", (e) => {
    if (e.pointerType === "touch" || e.timeStamp - last < 45) return;
    last = e.timeStamp;
    const t = document.createElement("span");
    t.className = "trail";
    t.style.left = e.clientX + "px"; t.style.top = e.clientY + "px";
    t.style.background = colors[n++ % colors.length];
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 750);
  }, { passive: true });
}

function start() {
  store.set("visits", store.get("visits", 0) + 1);
  renderChrome();
  sparkleTrail();
  for (let i = 0; i < Math.min(G.step, STEPS.length); i++) {   // replay the story so far
    const s = STEPS[i];
    if (s.show) pushLines(s.show);
    if (s.after) pushLines(s.after);
  }
  G.fresh = 0;
  if (G.step >= STEPS.length) graduate(); else openStep();
  requestAnimationFrame(pollPad);
  dsConnect();
}
start();
})();
</script>
